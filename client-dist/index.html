    <script>
      // Set data-theme before paint to avoid flash. Reads localStorage, else
      // falls back to the OS-level preference, else "dark".
      (function () {
        try {
          var t = localStorage.getItem("shekel-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
          // Phone browsers paint the address bar with theme-color — match the
          // topbar surface of the active theme.
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", t === "dark" ? "#1a1a19" : "#fcfcfb");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
